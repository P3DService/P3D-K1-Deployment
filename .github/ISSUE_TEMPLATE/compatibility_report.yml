name: Compatibility report
description: Подтверждение работы на другой firmware/hardware revision
title: "[COMPAT] "
labels:
  - compatibility
body:
  - type: dropdown
    id: model
    attributes:
      label: Модель
      options:
        - Creality K1C
        - Creality K1 Max
        - Другая K1-series
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware
      placeholder: "точная версия"
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: P3D K1 Deployment
      placeholder: "v0.5.1"
    validations:
      required: true

  - type: input
    id: helper
    attributes:
      label: Creality Helper Script commit
      placeholder: "git rev-parse HEAD"
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Что проверено
      options:
        - FRESH
        - RECONCILE
        - FRESH + repeat deploy
        - Healthcheck only
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Результат FULL healthcheck
      render: text
      placeholder: |
        PASS: 54
        WARN: 0
        FAIL: 0
        STATUS: PASS
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Особенности
      description: Hardware revision, камера, отличия путей, предупреждения BusyBox и т.п.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Я удалил приватные данные из вывода.
          required: true
