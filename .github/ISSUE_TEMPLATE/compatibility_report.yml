name: Compatibility report / Совместимость
description: Confirm operation on another firmware or hardware revision / Подтвердить работу на другой прошивке или ревизии
title: "[COMPAT] "
labels:
  - compatibility
body:
  - type: dropdown
    id: model
    attributes:
      label: Printer model / Модель
      options:
        - Creality K1C
        - Creality K1 Max
        - Other K1-series / Другая K1-series
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware / Прошивка
      placeholder: "exact version / точная версия"
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: P3D K1 Deployment
      placeholder: "v0.6.0"
    validations:
      required: true

  - type: input
    id: helper
    attributes:
      label: Creality Helper Script commit
      placeholder: "git rev-parse HEAD"
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Scenario tested / Проверенный сценарий
      options:
        - FRESH
        - RECONCILE
        - FRESH + repeat deploy
        - Healthcheck only
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: FULL healthcheck result / Результат FULL
      render: text
      placeholder: |
        PASS: 56
        WARN: 0
        FAIL: 0
        STATUS: PASS
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / Особенности
      description: Hardware revision, camera, path differences, BusyBox warnings, etc.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Приватность
      options:
        - label: I removed private data / Я удалил приватные данные
          required: true
