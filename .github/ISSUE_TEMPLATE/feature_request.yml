name: Feature request / Идея
description: Suggest an improvement to deployment, healthcheck or docs / Предложить улучшение deployment, healthcheck или документации
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / Какую проблему решаем
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and trade-offs / Риски и trade-offs

  - type: dropdown
    id: scope
    attributes:
      label: Area / Область
      options:
        - deploy.sh
        - healthcheck.sh
        - install.sh
        - Fluidd provisioning
        - camera
        - timelapse
        - Helper Script integration
        - documentation
        - external monitoring contract
        - other / другое
    validations:
      required: true
