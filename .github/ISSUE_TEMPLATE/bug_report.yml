name: Bug report
description: Ошибка deployment, healthcheck или совместимости K1-series
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не публикуйте пароли, SSH keys, токены и приватные данные.

  - type: dropdown
    id: model
    attributes:
      label: Модель
      options:
        - Creality K1C
        - Creality K1 Max
        - Другая K1-series
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: Версия прошивки Creality
      placeholder: "например 1.x.x.x"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: P3D K1 Deployment version
      placeholder: "например v0.5.1"
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Сценарий
      options:
        - FRESH после factory reset
        - RECONCILE существующей установки
        - Повторный deploy / idempotency
        - QUICK healthcheck
        - FULL healthcheck
        - Bootstrap install.sh
        - Другое
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Что произошло
      description: Кратко опишите ожидаемое и фактическое поведение.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Вывод консоли / healthcheck
      description: Удалите приватные данные перед публикацией.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Дополнительные логи
      description: При необходимости приложите tail deploy.log / healthcheck.log.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я удалил пароли, токены, SSH keys и приватные данные.
          required: true
        - label: Я проверил существующие issues.
          required: true
