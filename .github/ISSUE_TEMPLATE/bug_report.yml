name: Bug report / Ошибка
description: Report a deployment, healthcheck or compatibility problem / Сообщить об ошибке deployment, healthcheck или совместимости
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report / Спасибо за отчёт.
        Do not publish passwords, SSH keys, tokens or private infrastructure data.
        Не публикуйте пароли, SSH keys, токены и приватные данные инфраструктуры.

  - type: dropdown
    id: model
    attributes:
      label: Printer model / Модель принтера
      options:
        - Creality K1C
        - Creality K1 Max
        - Other K1-series / Другая K1-series
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version / Версия прошивки
      placeholder: "e.g. / например 1.x.x.x"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: P3D K1 Deployment version / Версия P3D K1 Deployment
      placeholder: "v0.6.0"
    validations:
      required: true

  - type: dropdown
    id: scenario
    attributes:
      label: Scenario / Сценарий
      options:
        - FRESH after factory reset / FRESH после factory reset
        - RECONCILE existing setup / RECONCILE существующей установки
        - Repeat deploy / Idempotency
        - QUICK healthcheck
        - FULL healthcheck
        - Bootstrap install.sh
        - Other / Другое
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened / Что произошло
      description: Expected vs actual behavior / Ожидаемое и фактическое поведение
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Console or healthcheck output / Вывод консоли или healthcheck
      description: Remove private data first / Удалите приватные данные
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional logs / Дополнительные логи
      description: deploy.log, healthcheck.log, Moonraker log excerpts if relevant

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / Проверки
      options:
        - label: I removed secrets and private data / Я удалил secrets и приватные данные
          required: true
        - label: I checked existing issues / Я проверил существующие issues
          required: true
